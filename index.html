<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PetMatch — La mascota correcta para tu vida</title>
<meta name="theme-color" content="#0E4D4A">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="stage">
  <aside class="brandside">
    <div class="logo"><span><i data-lucide="paw-print" class="i"></i></span>PetMatch</div>
    <h1 class="brand-title">La mascota correcta para tu vida.</h1>
    <p>Explora mascotas en adopción gratuita y cachorros disponibles para compra. Encuentra un perfil que encaje con tu rutina y conoce los cuidados que necesita.</p>
    <div class="brand-admin"><h1>Administración</h1><p>Solicitudes, reportes y conversaciones de seguimiento.</p></div>
  </aside>

  <main class="phone">
    <div class="screen">
      <div id="view" aria-live="polite"></div>
      <nav id="tabs" class="tabbar" aria-label="Navegación principal" style="transform:translateY(110px);opacity:0">
        <span class="glass-lens" aria-hidden="true"></span>
        <button class="tab" data-go="home" aria-label="Matches"><i data-lucide="layers" class="i"></i><small>Matches</small></button>
        <button class="tab" data-go="explore" aria-label="Explorar"><i data-lucide="search" class="i"></i><small>Explorar</small></button>
        <button class="tab" data-go="favs" aria-label="Guardadas"><i data-lucide="heart" class="i"></i><small>Guardadas</small></button>
        <button class="tab" data-go="track" aria-label="Seguimiento"><i data-lucide="activity" class="i"></i><span class="dot" style="display:none"></span><small>Seguir</small></button>
        <button class="tab" data-go="profile" aria-label="Perfil"><i data-lucide="user" class="i"></i><small>Perfil</small></button>
      </nav>
    </div>
  </main>


</div>
<script src="js/vendor/gsap.min.js"></script>
<script src="js/vendor/lucide.min.js"></script>
<script src="js/vendor/confetti.min.js"></script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/data.js"></script>
<script src="js/cases.js"></script>
<script src="js/app.js"></script>
<script>lucide.createIcons()</script>
</body>
</html>
